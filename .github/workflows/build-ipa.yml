name: IPA für TrollStore bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild -version
          xcodebuild \
            -project LichtLab.xcodeproj \
            -target LichtLab \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Als IPA verpacken
        run: |
          brew install ldid
          mkdir -p Payload
          cp -R build/Release-iphoneos/LichtLab.app Payload/
          # Pseudo-Signatur, TrollStore ersetzt sie bei der Installation
          ldid -S Payload/LichtLab.app/LichtLab
          zip -qry LichtLab.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LichtLab-ipa
          path: LichtLab.ipa
