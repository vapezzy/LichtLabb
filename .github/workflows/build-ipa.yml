name: IPA für TrollStore bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild -version
          xcodebuild \
            -project LichtLab.xcodeproj \
            -target LichtLab \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Compiler-Fehler als öffentlich sichtbare Hinweise ausgeben
          grep -E "error:" build.log | sort -u | head -40 | while read -r line; do echo "::error::$line"; done
          exit $status

      - name: Als IPA verpacken
        run: |
          brew install ldid
          mkdir -p Payload
          cp -R build/Release-iphoneos/LichtLab.app Payload/
          # Pseudo-Signatur, TrollStore ersetzt sie bei der Installation
          ldid -S Payload/LichtLab.app/LichtLab
          zip -qry LichtLab.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LichtLab-ipa
          path: LichtLab.ipa

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LichtLab Build ${{ github.run_number }}
          files: LichtLab.ipa
          make_latest: true
