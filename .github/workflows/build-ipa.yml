name: IPA für TrollStore bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Diagnose-Tests (ELM327-Simulator)
        run: sh tools/run_tests.sh

      - name: App bauen (ohne Signatur)
        run: |
          xcodebuild -version
          xcodebuild \
            -project RideReader.xcodeproj \
            -target RideReader \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          # Compiler-Fehler als öffentlich sichtbare Hinweise ausgeben
          grep -E "error:" build.log | sort -u | head -40 | while read -r line; do echo "::error::$line"; done
          exit $status

      - name: Als IPA verpacken
        run: |
          brew install ldid
          mkdir -p Payload
          cp -R build/Release-iphoneos/RideReader.app Payload/
          # Pseudo-Signatur mit App-Gruppe (Datenaustausch App ↔ Widget); TrollStore übernimmt die Berechtigungen
          ENT=RideReader/RideReader.entitlements
          if [ -d Payload/RideReader.app/PlugIns/RideReaderWidgets.appex ]; then
            ldid -S"$ENT" Payload/RideReader.app/PlugIns/RideReaderWidgets.appex/RideReaderWidgets
          else
            echo "::warning::Widget-Erweiterung fehlt im App-Paket"
          fi
          ldid -S"$ENT" Payload/RideReader.app/RideReader
          zip -qry RideReader.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RideReader-ipa
          path: RideReader.ipa

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RideReader Build ${{ github.run_number }}
          files: RideReader.ipa
          make_latest: true
